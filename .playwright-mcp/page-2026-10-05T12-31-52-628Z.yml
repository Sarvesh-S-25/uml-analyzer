          - paragraph [ref=f1e1080]:
            - text: "A key question in assessing the effectiveness of LLMs for software architecture is whether they outperform existing approaches (RQ4.3). Among the fourteen studies analyzed, nine included a comparison to other approaches. Five studies did not compare their methods to a baseline, limiting their ability to demonstrate relative effectiveness. In cases where a comparison was conducted, LLM-based solutions consistently outperformed the baseline in six studies. Two studies showed mixed results:"
            - generic [ref=f1e1081]:
              - text: "["
              - link "24" [ref=f1e1082] [cursor=pointer]:
                - /url: "#bib.bibx24"
              - text: "]"
            - text: demonstrated better results within-dataset, but worse across, and
            - generic [ref=f1e1083]:
              - text: "["
              - link "15" [ref=f1e1084] [cursor=pointer]:
                - /url: "#bib.bibx15"
              - text: "]"
            - text: performed better than the baselines according to the F
            - subscript [ref=f1e1085]: "1"
            - text: "-score, but showed lower precision in some cases. Another study"
            - generic [ref=f1e1086]:
              - text: "["
              - link "16" [ref=f1e1087] [cursor=pointer]:
                - /url: "#bib.bibx16"
              - text: "]"
            - text: was not able to outperform the baseline. However, these results suggest a generally positive impact of LLMs on software architecture tasks. While these results highlight the potential of LLMs, the lack of baseline comparisons in one-third of the studies indicates a need for more rigorous benchmarking to establish their practical advantages.
          - paragraph [ref=f1e1089]: RQ4.4 tackles reproducibility as it is a crucial aspect of scientific research, enabling independent verification of results. Nearly all studies provided some form of supplementary material, such as datasets, source code, or implementation details. However, two works proposing reference architectures did not include additional materials, possibly due to the conceptual nature of their contributions. This suggests a strong commitment to reproducibility within the field, though improvements in providing accessible and well-documented supplementary materials could further enhance transparency.
