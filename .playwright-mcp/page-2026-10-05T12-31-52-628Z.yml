      - generic [ref=f1e1195]:
        - heading "4 Threats to Validity" [level=2] [ref=f1e1196]:
          - generic [ref=f1e1197]: "4"
          - text: Threats to Validity
        - paragraph [ref=f1e1199]:
          - text: In the following section, we discuss threats to validity
          - generic [ref=f1e1200]:
            - text: "["
            - link "33" [ref=f1e1201] [cursor=pointer]:
              - /url: "#bib.bibx33"
            - text: "]"
          - text: . One threat involves not finding all relevant articles due to our search strategy and query employed. We mitigated this threat by evaluating different queries and the relevance of papers found with them beforehand. We also checked if the results included relevant papers we knew of as a gold standard
          - generic [ref=f1e1202]:
            - text: "["
            - link "6" [ref=f1e1203] [cursor=pointer]:
              - /url: "#bib.bibx6"
            - text: "]"
          - text: . Another threat is the misclassification of articles. We need to extract information from the articles to answer our research questions, making it necessary to understand them correctly. All authors have expertise in the research field of our review, and papers were assigned based on their knowledge of the respective areas. Moreover, we discussed any issues that arose among the complete team of authors, ensuring consistent and accurate classification.
      - generic [ref=f1e1204]:
        - heading "5 Discussion" [level=2] [ref=f1e1205]:
          - generic [ref=f1e1206]: "5"
          - text: Discussion
        - paragraph [ref=f1e1208]:
          - text: In the following, we discuss our findings from
          - link "Section 3" [ref=f1e1209] [cursor=pointer]:
            - /url: "#S3"
          - text: and identify future research directions.
        - generic [ref=f1e1210]:
          - heading "Software Architecture Tasks." [level=4] [ref=f1e1211]
          - paragraph [ref=f1e1213]:
            - text: Our study shows the diverse applications of LLMs in software architecture, with tasks falling into four main categories (cf.
            - link "Section 3.1" [ref=f1e1214] [cursor=pointer]:
              - /url: "#S3.SS1"
            - text: "): reference architectures, classification & detection, extraction & generation, and assistants. Examining the 14 articles on LLMs for software architecture, we found that most of them propose automated approaches that use LLMs end-to-end, suggesting that LLMs are capable of addressing complete architectural tasks."
          - paragraph [ref=f1e1216]: Besides the 14 articles covering the applications of LLMs in software architecture, we also found four articles concerning the application of software architecture to LLMs. They propose reference architectures for incorporating LLMs into different domains, such as self-adaptive systems, chatbot frameworks, and autonomous agents. By structuring interactions between LLMs and external systems, software architecture enables more robust and adaptable applications, stressing how software architecture research can not only use LLMs but also benefit them.
          - paragraph [ref=f1e1218]:
            - text: Surprisingly, we found only one work generating source code for architectural components using LLMs
            - generic [ref=f1e1219]:
              - text: "["
              - link "3" [ref=f1e1220] [cursor=pointer]:
                - /url: "#bib.bibx3"
              - text: "]"
            - text: . Also, there is only one paper regarding cloud-native computing and architecture
            - generic [ref=f1e1221]:
              - text: "["
              - link "3" [ref=f1e1222] [cursor=pointer]:
                - /url: "#bib.bibx3"
              - text: "]"
            - text: ", indicating a potential avenue for further research in this regard. We found no articles regarding evaluating quality aspects of software architecture, such as evolvability, and architecture conformance checking. Both could be addressed in future research, e.g., by building on works identifying architectural patterns"
            - generic [ref=f1e1223]:
              - text: "["
              - link "9" [ref=f1e1224] [cursor=pointer]:
                - /url: "#bib.bibx9"
              - text: "]"
            - text: and design rationales
            - generic [ref=f1e1225]:
              - text: "["
              - link "37" [ref=f1e1226] [cursor=pointer]:
                - /url: "#bib.bibx37"
              - text: "]"
            - text: from code.
        - generic [ref=f1e1227]:
          - heading "Usage of LLMs." [level=4] [ref=f1e1228]
          - paragraph [ref=f1e1230]:
            - text: Most approaches (73 %) rely on decoder-only models (
            - link "Section 3.2" [ref=f1e1231] [cursor=pointer]:
              - /url: "#S3.SS2"
            - text: ), particularly GPT-based variants, reflecting their dominance in recent research. This trend of using mostly decoder-only, GPT-based LLMs can also be observed in the broader software engineering context
            - generic [ref=f1e1232]:
              - text: "["
              - link "11" [ref=f1e1233] [cursor=pointer]:
                - /url: "#bib.bibx11"
              - text: ","
              - link "31" [ref=f1e1234] [cursor=pointer]:
                - /url: "#bib.bibx31"
              - text: "]"
            - text: . However, there is also no consensus for a specific variant
            - generic [ref=f1e1235]:
              - text: "["
              - link "11" [ref=f1e1236] [cursor=pointer]:
                - /url: "#bib.bibx11"
              - text: "]"
            - text: . Fine-tuning was common for encoder models, whereas decoder models were primarily used via prompting (
            - link "Section 3.3" [ref=f1e1237] [cursor=pointer]:
              - /url: "#S3.SS3"
            - text: ), with zero-shot prompting being the most frequent strategy (70 %). This also aligns with findings in the software testing context
            - generic [ref=f1e1238]:
              - text: "["
              - link "31" [ref=f1e1239] [cursor=pointer]:
                - /url: "#bib.bibx31"
              - text: "]"
            - text: ", where zero-shot prompting is also the most used strategy, followed by few-shot prompting. In the broader software engineering context,"
            - generic [ref=f1e1240]:
              - text: "["
              - link "11" [ref=f1e1241] [cursor=pointer]:
                - /url: "#bib.bibx11"
              - text: "]"
            - text: found that few-shot prompting was the most commonly employed strategy, followed by zero-shot prompting. All surveys, including ours, show that advanced prompting techniques, like Chain-of-Thought and Retrieval-Augmented Generation, are only rarely used. Exploring whether these techniques can enhance approaches used for software architecture tasks is a question for future research.
        - generic [ref=f1e1242]:
          - heading "Evaluation of Approaches." [level=4] [ref=f1e1243]
          - paragraph [ref=f1e1245]:
            - text: Evaluation methods were mainly technical experiments and benchmarking, with F
            - subscript [ref=f1e1246]: "1"
            - text: "-score being the most commonly used metric ("
            - link "Section 3.4" [ref=f1e1247] [cursor=pointer]:
              - /url: "#S3.SS4"
            - text: ). While most studies showed LLMs outperforming baselines, around one-third lacked comparative evaluation to a baseline. This indicates a need for more rigorous validation to demonstrate the added benefits of utilizing LLMs. However, nearly all studies provide supplementary material, enabling further insight into the approaches and results.
        - generic [ref=f1e1248]:
          - heading "Future Work." [level=4] [ref=f1e1249]
          - paragraph [ref=f1e1251]: Future research directions mentioned by the authors of the studies include testing different LLMs, refining input strategies, and integrating advanced techniques such as retrieval-augmented generation (RAG) and fine-tuning. These findings suggest that while LLMs offer significant potential for software architecture tasks and outperform baselines, it is a multi-dimensional problem to apply them in a way that ensures the best results.
        - generic [ref=f1e1252]:
          - heading "The Future of LLMs in Software Architecture." [level=4] [ref=f1e1253]
          - paragraph [ref=f1e1255]:
            - text: Our findings indicate that the current body of published research on this topic is relatively limited. This is consistent with the review by
            - generic [ref=f1e1256]:
              - text: "["
              - link "8" [ref=f1e1257] [cursor=pointer]:
                - /url: "#bib.bibx8"
              - text: "]"
            - text: "that characterized LLM-based design as an open research direction. Yet, there seems to be emerging research, as shown by the number of workshop publications and at this year’s ICSA. One of the reasons for the comparatively low number of papers in software architecture as opposed to other software engineering disciplines could be that the capabilities of LLMs were not sufficient to perform software architecture tasks until then: The three studies from before 2024 that utilize encoder-only models were not able to demonstrate consistent improvements of their approaches over the baselines"
            - generic [ref=f1e1258]:
              - text: "["
              - link "15" [ref=f1e1259] [cursor=pointer]:
                - /url: "#bib.bibx15"
              - text: ","
              - link "16" [ref=f1e1260] [cursor=pointer]:
                - /url: "#bib.bibx16"
              - text: ","
              - link "24" [ref=f1e1261] [cursor=pointer]:
                - /url: "#bib.bibx24"
              - text: "]"
            - text: ". This also illustrates the need for the continuous evaluation of both LLMs and proposed approaches for software architecture tasks: Given the fast-paced development of LLM technology, future research should consider strategies for ongoing assessment and adaptation of models in software architecture contexts."
      - generic [ref=f1e1262]:
        - heading "6 Conclusion" [level=2] [ref=f1e1263]:
          - generic [ref=f1e1264]: "6"
          - text: Conclusion
        - paragraph [ref=f1e1266]: In this paper, we present a systematic literature review on the usage of LLMs in software architecture and vice versa. Analyzing 18 relevant articles, we find that LLMs are mainly applied to tasks within Classification & Detection, Extraction & Generation, Assistants, and Reference Architecture, also showing how software architecture can be applied to LLMs. Most studies used decoder-only models, specifically GPT-based variants. While the number of articles covering software architecture and LLMs is increasing, the current body of research on this topic is relatively limited, and some areas, such as generating source code from architectural design, cloud-native computing and architecture, and checking conformance, are not well covered.
        - paragraph [ref=f1e1268]:
          - text: Most studies evaluate LLM-based approaches through technical experiments and benchmarking, often using performance metrics like the F
          - subscript [ref=f1e1269]: "1"
          - text: "-score. However, about one-third of the studies do not compare their results to a baseline, showing that stronger comparative evaluation is needed. Additionally, most studies use basic prompting techniques, while more advanced methods, such as Chain-of-Thought prompting and Retrieval-Augmented Generation, are rarely explored."
        - paragraph [ref=f1e1271]: Our results suggest that future research should focus on improving LLM performance by refining input strategies, using more advanced prompting techniques, and regularly testing model capabilities. As LLMs continue to improve, their role in software architecture will likely grow, making continuous evaluation important to ensure their reliability and usefulness. As LLMs continue to evolve and more research emerges, this review should be repeated soon to keep up with new developments and trends.
      - generic [ref=f1e1272]:
