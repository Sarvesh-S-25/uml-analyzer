              - /url: "#bib.bibx2"
            - text: "]"
          - text: and digital twins
          - generic [ref=f1e177]:
            - text: "["
            - link "36" [ref=f1e178] [cursor=pointer]:
              - /url: "#bib.bibx36"
            - text: ","
            - link "23" [ref=f1e179] [cursor=pointer]:
              - /url: "#bib.bibx23"
            - text: "]"
          - text: ", analyzing logs"
          - generic [ref=f1e180]:
            - text: "["
            - link "21" [ref=f1e181] [cursor=pointer]:
              - /url: "#bib.bibx21"
            - text: ","
            - link "34" [ref=f1e182] [cursor=pointer]:
              - /url: "#bib.bibx34"
            - text: "]"
          - text: ", and answering developing questions"
          - generic [ref=f1e183]:
            - text: "["
            - link "25" [ref=f1e184] [cursor=pointer]:
              - /url: "#bib.bibx25"
            - text: "]"
          - text: ". Their ability to analyze vast amounts of data and identify patterns also helps in optimizing system performance and predicting potential issues early: LLMs can not only streamline workflows but also foster innovation and improve overall software quality."
        - paragraph [ref=f1e186]:
          - text: Software architecture tasks also often require vast knowledge. Consequently, there is an emerging synergy between software architecture and LLMs. For example, LLMs have been explored for architecture tasks such as identifying design decisions
          - generic [ref=f1e187]:
            - text: "["
            - link "15" [ref=f1e188] [cursor=pointer]:
              - /url: "#bib.bibx15"
            - text: ","
            - link "27" [ref=f1e189] [cursor=pointer]:
              - /url: "#bib.bibx27"
            - text: "]"
          - text: ", generating architecture designs from requirements"
          - generic [ref=f1e190]:
            - text: "["
            - link "13" [ref=f1e191] [cursor=pointer]:
              - /url: "#bib.bibx13"
            - text: "]"
          - text: ", and answering questions about architectural knowledge"
          - generic [ref=f1e192]:
            - text: "["
            - link "28" [ref=f1e193] [cursor=pointer]:
              - /url: "#bib.bibx28"
            - text: "]"
          - text: . Moreover, software architecture can be applied to developing LLM-based systems by providing reference architectures for different use cases
          - generic [ref=f1e194]:
            - text: "["
            - link "7" [ref=f1e195] [cursor=pointer]:
              - /url: "#bib.bibx7"
            - text: ","
            - link "32" [ref=f1e196] [cursor=pointer]:
              - /url: "#bib.bibx32"
            - text: ","
            - link "22" [ref=f1e197] [cursor=pointer]:
              - /url: "#bib.bibx22"
            - text: ","
            - link "26" [ref=f1e198] [cursor=pointer]:
              - /url: "#bib.bibx26"
            - text: "]"
          - text: .
        - paragraph [ref=f1e200]:
          - text: Systematic literature reviews on the use of LLMs provide researchers and practitioners with comprehensive insights into current trends, challenges, and best practices. These reviews help identify gaps in existing knowledge, guide future research directions, and inform evidence-based decision-making in the development and application of LLMs. However, reviews on the use of LLMs in the scope of software engineering mainly focus on testing
          - generic [ref=f1e201]:
            - text: "["
            - link "31" [ref=f1e202] [cursor=pointer]:
              - /url: "#bib.bibx31"
            - text: "]"
          - text: or code generation
          - generic [ref=f1e203]:
            - text: "["
            - link "35" [ref=f1e204] [cursor=pointer]:
              - /url: "#bib.bibx35"
            - text: "]"
          - text: . Most articles in existing literature reviews on LLM usage in general software engineering
          - generic [ref=f1e205]:
            - text: "["
            - link "8" [ref=f1e206] [cursor=pointer]:
              - /url: "#bib.bibx8"
            - text: ","
            - link "11" [ref=f1e207] [cursor=pointer]:
              - /url: "#bib.bibx11"
            - text: "]"
          - text: "are not related to software architecture:"
          - generic [ref=f1e208]:
            - text: "["
            - link "11" [ref=f1e209] [cursor=pointer]:
              - /url: "#bib.bibx11"
            - text: "]"
          - text: do not include works from the software architecture community, as the search keys did not include relevant terms (only "software design" could be considered related). Even for design-related tasks,
          - generic [ref=f1e210]:
            - text: "["
            - link "8" [ref=f1e211] [cursor=pointer]:
              - /url: "#bib.bibx8"
            - text: "]"
          - text: report that they did not find much work on LLM-based software design. Different from code generation and tests, architecture tasks often affect higher level concerns and encounter data scarcity problems. These disparities highlight the value of a comprehensive review of software architecture and LLMs. To the best of our knowledge, no such review exists, making a systematic literature review particularly useful.
        - paragraph [ref=f1e213]:
          - text: Therefore, in this paper, we conduct a systematic literature review of research papers at the intersection between LLMs and software architecture. We formulate our research questions to derive insights into the current state-of-the-art in this field and about what is working well, challenges, and open questions. From the software architecture side, we analyze the software architecture tasks targeted by these works and how the performance of LLMs is evaluated. From the LLMs’ side, we explore which LLMs are used and how they are optimized. To provide insights into the path ahead for the synergy between LLMs and software architecture, we also analyze the discussed future work. Moreover, we give an initial overview on envisioned reference architectures for developing LLM systems. Following the methodology for systematic literature reviews on software engineering
          - generic [ref=f1e214]:
            - text: "["
            - link "19" [ref=f1e215] [cursor=pointer]:
              - /url: "#bib.bibx19"
            - text: ","
            - link "18" [ref=f1e216] [cursor=pointer]:
              - /url: "#bib.bibx18"
            - text: "]"
          - text: ", we initially found 119 with our search strategy, of which we identify and analyze 18 relevant papers about LLMs and architecture. We provide the complete data of this survey as supplementary material"
          - generic [ref=f1e217]:
            - text: "["
            - link "29" [ref=f1e218] [cursor=pointer]:
              - /url: "#bib.bibx29"
            - text: "]"
          - text: .
        - paragraph [ref=f1e220]:
          - text: This literature review can benefit
          - generic [ref=f1e221]:
            - generic [ref=f1e222]: (i) software architecture researchers who want to apply LLMs in their architecture tasks and
            - generic [ref=f1e223]: (ii) LLM-based systems developers who want to build their LLM systems with better architecture.
        - paragraph [ref=f1e225]:
          - text: In the following, we first present our methodology to the review in
          - link "Section 2" [ref=f1e226] [cursor=pointer]:
            - /url: "#S2"
          - text: . After that,
          - link "Section 3" [ref=f1e227] [cursor=pointer]:
            - /url: "#S3"
          - text: presents our findings on our RQs, and
          - link "Section 4" [ref=f1e228] [cursor=pointer]:
            - /url: "#S4"
          - text: discusses threats to validity. We further discuss our findings and outline future research directions in
          - link "Section 5" [ref=f1e229] [cursor=pointer]:
            - /url: "#S5"
          - text: . Finally,
          - link "Section 6" [ref=f1e230] [cursor=pointer]:
            - /url: "#S6"
          - text: concludes the paper.
      - generic [ref=f1e231]:
        - heading "2 Methodology" [level=2] [ref=f1e232]:
          - generic [ref=f1e233]: "2"
          - text: Methodology
        - paragraph [ref=f1e235]:
          - text: This section describes the approach we followed to select, analyze, and evaluate relevant research on the intersection of software architecture and LLMs. We follow the methodology defined by Kitchenham et al.
          - generic [ref=f1e236]:
            - text: "["
            - link "19" [ref=f1e237] [cursor=pointer]:
              - /url: "#bib.bibx19"
            - text: ","
            - link "18" [ref=f1e238] [cursor=pointer]:
              - /url: "#bib.bibx18"
            - text: "]"
          - text: ". Therefore, our review process consists of three main phases: 1. Planning the review by formulating research questions of interest ("
          - link "Section 2.1" [ref=f1e239] [cursor=pointer]:
            - /url: "#S2.SS1"
          - text: ) and defining a search strategy (
          - link "Section 2.2" [ref=f1e240] [cursor=pointer]:
            - /url: "#S2.SS2"
          - text: ), 2. filtering the articles obtained by our search (
          - link "Section 2.3" [ref=f1e241] [cursor=pointer]:
            - /url: "#S2.SS3"
          - text: ), and 3. analyzing the remaining relevant articles (
          - link "Section 2.4" [ref=f1e242] [cursor=pointer]:
            - /url: "#S2.SS4"
          - text: ).
        - generic [ref=f1e243]:
          - heading "2.1 Research Questions" [level=3] [ref=f1e244]:
            - generic [ref=f1e245]: "2.1"
            - text: Research Questions
          - paragraph [ref=f1e247]: Our review aims to provide an overview of the current applications of LLMs to software architecture research and vice versa, i.e., how software architecture research is applied to LLMs. We want to provide insight into what works well, what does not, and what challenges remain.
          - paragraph [ref=f1e249]: First, we investigate which software architecture tasks LLMs are used for (RQ1) to understand which tasks are already being researched and potentially solved, and which remain an open challenge. To gain more detailed insight, we examine the degree of automation these approaches provide (RQ1.1), distinguishing between manual guidance, semi-automated, and fully automated methods. Additionally, we assess whether LLMs are applied end-to-end or only to specific sub-tasks within the broader software architecture process (RQ1.2).
          - paragraph [ref=f1e251]: Since the LLMs’ capabilities can vary significantly, our goal is to identify which LLMs are used in the reviewed studies (RQ2). This research question provides insight into the most commonly applied models and whether there is a preference for general-purpose or domain-specific LLMs in software architecture.
          - paragraph [ref=f1e253]:
            - text: To understand how researchers tune LLM performance, we examine the techniques used to improve effectiveness (RQ3). Specifically, we investigate the used tuning techniques (RQ3.1) and prompt engineering strategies (RQ3.2). RQ3 as well as RQ2 are based on the investigation by
            - generic [ref=f1e254]:
              - text: "["
              - link "11" [ref=f1e255] [cursor=pointer]:
                - /url: "#bib.bibx11"
              - text: "]"
            - text: .
          - paragraph [ref=f1e257]:
            - text: Evaluating the effectiveness of LLM-based approaches is crucial for understanding their practical applicability. Therefore, we explore how these approaches are evaluated (RQ4) by analyzing the evaluation methods used (RQ4.1)
            - generic [ref=f1e258]:
              - text: "["
              - link "20" [ref=f1e259] [cursor=pointer]:
                - /url: "#bib.bibx20"
              - text: "]"
            - text: and the specific metrics applied (RQ4.2). Furthermore, we examine whether these methods outperform existing baselines (RQ4.3) and assess whether supplementary materials are provided (RQ4.4) to support reproducibility.
          - paragraph [ref=f1e261]: Finally, to gain insights into the future directions of LLM research in software architecture, we analyze what future work the authors of the reviewed studies suggest (RQ5). Identifying open challenges and proposed research directions helps outline the next steps to advance LLM applications in this domain.
        - generic [ref=f1e262]:
          - heading "2.2 Search Strategy" [level=3] [ref=f1e263]:
            - generic [ref=f1e264]: "2.2"
            - text: Search Strategy
          - paragraph [ref=f1e266]: "We extracted a search query based on our goal to provide an overview of the applications of LLMs in software architecture and vice versa. Therefore, one part of our query is the keyword software architecture that has to be within the article for us to regard it as relevant. Moreover, the article has to contain a keyword related to LLMs. As not all articles may use the same keyword related to their usage of LLMs, we included several different terms the article has to contain at least one of, including the currently most popular models: \"LLM\" OR \"language model\" or \"language models\" OR \"generative AI\" OR \"bert\" OR \"GPT\" OR \"Llama\" OR \"Transformer\"."
          - paragraph [ref=f1e268]:
            - text: We use this search string to search for articles in 25 top software engineering conferences and journals, such as ICSE, ASE, ICSA, ECSA, TSE, TOSEM, by using Google Scholar and defining them as sources of the publication. We provide the complete list of venues as part of our supplementary material
            - generic [ref=f1e269]:
              - text: "["
              - link "29" [ref=f1e270] [cursor=pointer]:
                - /url: "#bib.bibx29"
              - text: "]"
            - text: . For the most closely related conferences, namely ICSA and ECSA, we modify the search string not to need to contain the term software architecture, as the scope of the conference already implies that the article is related to software architecture. Moreover, we also include companion proceedings from these two conferences. This search leads to 119 articles.
        - generic [ref=f1e271]:
          - heading "2.3 Filtering of Results" [level=3] [ref=f1e272]:
            - generic [ref=f1e273]: "2.3"
            - text: Filtering of Results
          - paragraph [ref=f1e275]: Based on our initial search, resulting in 119 articles, we filter the results to make sure the articles are actually relevant to our survey. First, we check if they contain the term software architecture as part of the article and find that 44 articles only mention it as part of the references, e.g., when citing an article from a software architecture conference. Next, we assess if an article is a full article from the research track of the respective conference – except for ICSA and ECSA, where we also consider contributions from the companion proceedings – and if it conducts research on the topic of software architecture and LLMs. We distribute this step among the team of authors and refer to the ICSA scope of topics in the call for papers for determining if the article is in the scope of software architecture as inclusion criteria. Notably, this implies the exclusion criteria that domain and UML models like class and activity diagrams are excluded. Moreover, we exclude research related to only design patterns as opposed to architectural patterns. We filter 12 articles based on not being full articles, and 15 more because they are not related to software architecture and LLMs. We filter one additional article because it is a survey article; therefore, it only discusses existing research and does not propose a new approach. We notice that two more articles, while presenting slightly different ideas, show the same evaluation. Therefore, we subsume them into one article.
        - generic [ref=f1e276]:
          - heading "2.4 Analysis of articles" [level=3] [ref=f1e277]:
            - generic [ref=f1e278]: "2.4"
            - text: Analysis of articles
          - paragraph [ref=f1e280]:
            - text: After filtering the results, we end up with 18 unique and relevant articles.
            - link "Figure 1" [ref=f1e281] [cursor=pointer]:
              - /url: "#S2.F1"
            - text: shows their distribution by venue and year of publication. While the first article was already published in 2020 at ECSA, there was only one publication in the following years, and there was no publication in 2023. However, 2024 shows a steep increase with 10 articles, five of them being part of companion proceedings. In 2025, five articles have already been published, further indicating that the upward trend in publications will continue. Most articles (14/18) are published at ICSA, ECSA, or in their companion proceedings. This is not surprising as both conferences are the most closely related to the topic of our review.
          - paragraph [ref=f1e283]:
            - text: We then extracted relevant data from the articles to answer our research questions outlined above (cf.
            - link "Section 2.1" [ref=f1e284] [cursor=pointer]:
              - /url: "#S2.SS1"
            - text: ).
