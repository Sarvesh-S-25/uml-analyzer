            - text: "RQ4: Evaluation of Approaches"
          - paragraph [ref=f1e1067]:
            - text: For the evaluation of LLM-based approaches in software architecture tasks (RQ4.1), the most common methods were technical experiments and benchmarking, followed by case studies (cf.
            - link "Figure 4" [ref=f1e1068] [cursor=pointer]:
              - /url: "#S3.F4"
            - text: ). Technical experiments were the dominant evaluation method, used in 64 % of studies (cf.
