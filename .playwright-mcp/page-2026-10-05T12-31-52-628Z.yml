      - generic [ref=f1e163]:
        - heading "Abstract" [level=6] [ref=f1e164]
        - paragraph [ref=f1e165]: Large Language Models (LLMs) are used for many different software engineering tasks. In software architecture, they have been applied to tasks such as classification of design decisions, detection of design patterns, and generation of software architecture design from requirements. However, there is little overview on how well they work, what challenges exist, and what open problems remain. In this paper, we present a systematic literature review on the use of LLMs in software architecture. We analyze 18 research articles to answer five research questions, such as which software architecture tasks LLMs are used for, how much automation they provide, which models and techniques are used, and how these approaches are evaluated. Our findings show that while LLMs are increasingly applied to a variety of software architecture tasks and often outperform baselines, some areas, such as generating source code from architectural design, cloud-native computing and architecture, and checking conformance remain underexplored. Although current approaches mostly use simple prompting techniques, we identify a growing research interest in refining LLM-based approaches by integrating advanced techniques.
      - generic [ref=f1e166]:
        - 'heading "Keywords: :" [level=6] [ref=f1e167]'
        - text: Systematic Literature Review Software Architecture Large Language Models LLM4SA Software Engineering LLM4SE.
      - generic [ref=f1e168]:
        - heading "1 Introduction" [level=2] [ref=f1e169]:
          - generic [ref=f1e170]: "1"
          - text: Introduction
        - paragraph [ref=f1e172]:
          - text: Large language models (LLMs) are revolutionizing software engineering by offering exceptional capabilities in natural language understanding and generation. These models can significantly enhance productivity by, e.g., automating code generation
