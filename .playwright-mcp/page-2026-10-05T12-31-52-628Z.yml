            - text: ). Benchmarking was conducted in 43 % of studies, often involving comparisons with traditional or state-of-the-art approaches. Case studies were used in 29 % of studies, offering qualitative insights into real-world applications. Other evaluation methods each only appeared once, including data science-based validation, interviews, and controlled experiments.
          - paragraph [ref=f1e1071]:
            - text: Looking into RQ4.2, the evaluation of the LLM-generated outputs employed both traditional performance metrics and text-generation metrics. Traditional performance metrics (e.g., precision, recall, F
