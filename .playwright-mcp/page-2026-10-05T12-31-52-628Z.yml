        - generic [ref=f1e881]:
          - 'heading "3.3 RQ3: Optimization Techniques" [level=3] [ref=f1e882]':
            - generic [ref=f1e883]: "3.3"
            - text: "RQ3: Optimization Techniques"
          - paragraph [ref=f1e885]: We observed a clear distinction in tuning approaches based on the type of model. Encoder models were consistently fine-tuned across studies, emphasizing the need for task-specific adaptation due to their transformer-based masked language modeling pre-training. Fine-tuning allows researchers to tailor the model to software architecture tasks by training it on domain-specific data.
          - paragraph [ref=f1e887]: In contrast, decoder models like those from the GPT family were predominantly utilized through prompting techniques rather than fine-tuning, likely due to accessibility and cost constraints.
          - paragraph [ref=f1e889]:
            - link "4(a)" [ref=f1e890] [cursor=pointer]:
              - /url: "#S3.F4.sf1"
            - text: shows the overview of prompting techniques used. We found that researchers most commonly employed zero-shot prompting (70 % of used techniques). This aligns with the general usability of LLMs, as zero-shot prompting allows direct application without further training. This can also mean that the pre-trained LLMs encode enough knowledge for many software architecture tasks.
          - paragraph [ref=f1e892]: Few-shot prompting was used less frequently (15 %), suggesting that providing examples is not necessarily required for software architecture tasks.
          - paragraph [ref=f1e894]: More advanced prompt engineering strategies were rarely applied, which could indicate an area for future exploration. Chain-of-Thought prompting was used only in one study despite its potential to improve reasoning-based tasks. Retrieval-Augmented Generation was also applied only once, indicating that integrating external knowledge sources is not yet a common practice in this domain. Similarly, template-based prompting appeared in a single instance, suggesting that structured prompt design is underexplored for software architecture tasks.
